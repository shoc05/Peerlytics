name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  website:
    # This name is a required status check in branch protection. Keep it in sync with scripts/setup-github.sh.
    name: Website (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  backend:
    # Required status check; keep in sync with scripts/setup-github.sh.
    name: backend (lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

  backend-db:
    # Not a required check yet (step 0.6/1.5, Sonam). Ask Sangay to add it in scripts/setup-github.sh.
    name: backend db (migrations, docker)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: peerlytics
          # Throwaway CI-only database; not a secret.
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peerlytics"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Migrations up/down and the append-only triggers on a real PostgreSQL
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://peerlytics:ci-only-password@127.0.0.1:5432/postgres
        run: npm run test:db
      - name: Build the backend image
        run: docker build -f backend/Dockerfile -t peerlytics-backend:ci .

  postman:
    # Step 3.3 (Sonam): the Postman collection end to end with Newman, against the API backed by
    # PostgreSQL and the Firebase Auth + Firestore emulators. Not a required check yet.
    name: postman (newman)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: peerlytics
          # Throwaway CI-only database; not a secret.
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: peerlytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peerlytics"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://peerlytics:ci-only-password@127.0.0.1:5432/peerlytics
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: backend
      - name: Every route in openapi.yaml is in the collection
        run: node --test postman/collection.test.mjs
      - name: Migrate the database
        working-directory: backend
        run: npm run migrate:up
      - name: Run the collection with Newman
        run: npx firebase emulators:exec --only auth,firestore --project demo-peerlytics "bash postman/ci/run-newman.sh"

  ansible:
    # Step 3.3 (Sonam): syntax check and lint of the server playbook. A real run needs a server
    # (see infra/ansible/README.md). Not a required check yet.
    name: ansible (syntax, lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/ansible
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Ansible and ansible-lint
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet ansible-core==2.17.7 ansible-lint==24.12.2
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: ansible-galaxy collection install -r requirements.yml -p collections
      - name: Syntax check
        run: |
          # The key file is only read when the playbook runs; any file will do for a syntax check.
          echo "ssh-ed25519 placeholder-for-syntax-check-only ci" > "$RUNNER_TEMP/ci.pub"
          ansible-playbook site.yml -i inventory.example.ini --syntax-check -e deploy_ssh_public_key_file="$RUNNER_TEMP/ci.pub"
      - run: ansible-lint site.yml

  k8s:
    # Step 4.1 (Sonam): every overlay in infra/k8s/app builds with kustomize and passes
    # kubeconform (Kubernetes 1.31 schemas; Traefik CRDs from the community catalog).
    name: k8s (kustomize, kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install kubeconform 0.6.7
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kubeconform.tar.gz" https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP" kubeconform
      - name: Build and check every overlay
        run: |
          for overlay in infra/k8s/app/overlays/*/; do
            echo "== $overlay"
            kubectl kustomize "$overlay" | "$RUNNER_TEMP/kubeconform" -strict -summary -kubernetes-version 1.31.0               -schema-location default               -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done
          kubeconform_files="infra/k8s/traefik/helmchartconfig.yaml"
          "$RUNNER_TEMP/kubeconform" -strict -summary -ignore-missing-schemas $kubeconform_files
      - name: Shell scripts (shellcheck)
        run: shellcheck -S warning infra/scripts/*.sh postman/ci/*.sh

  collab:
    # Step 2.2 live-editing server. Not yet a required check; add it to scripts/setup-github.sh to make it one.
    name: collab (lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collab
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: collab/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

  firestore-rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test Firestore rules in the emulator
        run: npm run test:rules

  auth-emulator:
    # Step 1.2 auth routes against the Auth + Firestore emulators. Not yet a required check;
    # add it to scripts/setup-github.sh to make it one.
    name: Auth emulator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: backend
      - name: Test auth routes in the emulators
        run: npm run test:auth
      - name: Test the server deadline job in the emulator
        run: npm run test:deadlines
