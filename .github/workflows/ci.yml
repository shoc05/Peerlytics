name: CI

# Step 0.5. Stage 1: frontend, services (backend, collab, notifier), Firestore rules, Auth emulator.
# Stage 2: integration against a real PostgreSQL. Stage 3: Docker build check (nothing is pushed).
# e2e stays off until N7 (step 4.8); the job is at the end of this file.
# Three job names are required status checks on develop and main (scripts/setup-github.sh), so renaming
# one blocks every PR. Those jobs never use needs:, because GitHub counts a skipped job as passed.
# A job that needs another sets its own if: with !cancelled() (plus any result it relies on): the default
# success() would skip it when any earlier job in the chain fails, even an optional matrix leg.
# .github/scripts/workflow-rules.test.cjs checks these rules, the action pins and the env: rule.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  # On a PR a new push cancels the older run; on develop a running check always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frontend:
    # Required status check; keep the name in sync with scripts/setup-github.sh.
    name: Website (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test with coverage
        run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/lcov.info ]; then
            awk -F: -v label="Website" '/^LF:/ { found += $2 } /^LH:/ { hit += $2 } END { if (found) printf "%s line coverage: %.1f%% (%d of %d lines)\n", label, 100 * hit / found, hit, found }' coverage/lcov.info >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports-frontend
          path: coverage/
          retention-days: 14
      - name: Build
        run: npm run build

  services:
    # "backend (lint, test)" is a required status check and comes from this name template; keep it in
    # sync with scripts/setup-github.sh. Only a leg marked optional may have no folder yet; it is skipped
    # with a notice. Any other missing folder fails its check, so a required check never passes empty.
    name: ${{ matrix.service }} (lint, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [backend, collab, notifier]
        include:
          # notifier/ arrives in step 2.5; remove this entry once it exists.
          - service: notifier
            optional: true
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check that the folder exists
        id: folder
        working-directory: .
        env:
          SERVICE: ${{ matrix.service }}
          OPTIONAL: ${{ matrix.optional }}
        run: |
          if [ -f "$SERVICE/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [ "$OPTIONAL" = "true" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$SERVICE/ does not exist yet, so its lint and tests are skipped."
          else
            echo "::error::$SERVICE/package.json is missing, so this check cannot run."
            exit 1
          fi
      - if: steps.folder.outputs.exists == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - if: steps.folder.outputs.exists == 'true'
        run: npm ci
      - name: Lint
        if: steps.folder.outputs.exists == 'true'
        run: npm run lint
      - name: Test with coverage
        if: steps.folder.outputs.exists == 'true'
        run: npm run test:coverage
      - name: Coverage summary
        if: always() && steps.folder.outputs.exists == 'true'
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          if [ -f coverage/lcov.info ]; then
            awk -F: -v label="$SERVICE" '/^LF:/ { found += $2 } /^LH:/ { hit += $2 } END { if (found) printf "%s line coverage: %.1f%% (%d of %d lines)\n", label, 100 * hit / found, hit, found }' coverage/lcov.info >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload test results and coverage
        if: always() && steps.folder.outputs.exists == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/coverage/
          retention-days: 14

  integration:
    # The backend against a throwaway PostgreSQL 16: migrations up and down, the append-only triggers and
    # the deadline store. Formerly "backend db (migrations, docker)"; the image build moved to the docker
    # job. Not a required check yet (step 0.6/1.5, Sonam). Ask Sangay to add it in scripts/setup-github.sh.
    # It waits for the services stage but runs whatever its result, so a failing optional leg (collab,
    # notifier) can't skip the database tests; a cancelled run still stops it.
    name: integration (PostgreSQL 16)
    needs: services
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: peerlytics
          # Throwaway CI-only database; not a secret.
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peerlytics"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Migrations up/down and the append-only triggers on a real PostgreSQL
        shell: bash
        env:
          TEST_DATABASE_URL: postgres://peerlytics:ci-only-password@127.0.0.1:5432/postgres
        run: |
          mkdir -p ../test-results
          npm run test:db 2>&1 | tee ../test-results/integration.log
      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports-integration
          path: test-results/
          retention-days: 14

  firestore-rules:
    # Required status check; keep the name in sync with scripts/setup-github.sh.
    name: Firestore rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache the Firebase emulators
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-
      - name: Test Firestore rules in the emulator
        shell: bash
        run: |
          mkdir -p test-results
          npm run test:rules 2>&1 | tee test-results/firestore-rules.log
      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports-firestore-rules
          path: test-results/
          retention-days: 14

  auth-emulator:
    # Step 1.2 auth routes against the Auth + Firestore emulators. Not yet a required check;
    # add it to scripts/setup-github.sh to make it one.
    name: Auth emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: backend
      - name: Cache the Firebase emulators
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-
      - name: Test auth routes in the emulators
        shell: bash
        run: |
          mkdir -p test-results
          npm run test:auth 2>&1 | tee test-results/auth-emulator.log
      - name: Test the server deadline job in the emulator
        shell: bash
        run: |
          mkdir -p test-results
          npm run test:deadlines 2>&1 | tee test-results/deadlines-emulator.log
      - name: Upload the test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports-auth-emulator
          path: test-results/
          retention-days: 14

  docker:
    # Each service image still builds. Build only: no registry login and nothing is pushed (pushing to
    # GHCR is build-images.yml, step 1.9). A service without a Dockerfile yet is skipped with a notice.
    # Builds only after integration passed. The explicit result check is needed: with the default
    # success(), a failed services leg earlier in the chain would skip this job even then.
    name: docker build (${{ matrix.service }})
    needs: integration
    if: ${{ !cancelled() && needs.integration.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # backend builds from the repo root because its image also copies one frontend helper.
          - service: backend
            context: .
          - service: collab
            context: collab
          - service: notifier
            context: notifier
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the image
        env:
          SERVICE: ${{ matrix.service }}
          CONTEXT: ${{ matrix.context }}
        run: |
          if [ ! -f "$SERVICE/Dockerfile" ]; then
            echo "::notice::$SERVICE/Dockerfile does not exist yet, so its image build is skipped."
            exit 0
          fi
          docker build --file "$SERVICE/Dockerfile" --tag "peerlytics-$SERVICE:ci" "$CONTEXT"

  # e2e:
  #   # Off until N7 (step 4.8, Ngawang): Playwright tests in e2e/ against the Firebase emulators and a
  #   # throwaway PostgreSQL. To switch it on, add a test:e2e script and uncomment this job.
