name: Jira key check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  jira-key:
    # Required status check; keep in sync with scripts/setup-github.sh.
    name: Jira key in PR title
    runs-on: ubuntu-latest
    steps:
      - name: Require a PEER key at the start of the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$TITLE" =~ ^PEER-[0-9]+[[:space:]]+.+$ ]]; then
            echo "::error::PR title must start with 'PEER-<number> Description', for example 'PEER-12 Add login page'."
            exit 1
          fi
          echo "PR title format is valid."
