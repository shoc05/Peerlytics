name: Push guard

# Step 0.5b: every change to develop and main must come through a pull request.
# A push that skips one fails this run, opens a "direct-push" issue and says why
# in the job summary. Logic and tests: .github/scripts/push-guard.cjs.
on:
  push:
    branches: [develop, main, guard-test]
    tags-ignore: ['**']

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  guard:
    name: Direct push guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Check that every pushed commit came through a merged PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Event values reach the script only through env, never through ${{ }} inside it.
          BRANCH: ${{ github.ref_name }}
          PUSHER: ${{ github.event.pusher.name }}
          ACTOR: ${{ github.actor }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          CREATED: ${{ github.event.created }}
          DELETED: ${{ github.event.deleted }}
          ALLOWED_DIRECT_PUSHERS: ${{ vars.ALLOWED_DIRECT_PUSHERS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const { checkPush } = require('./.github/scripts/push-guard.cjs');
            await checkPush({ github, core, repo: context.repo, env: process.env });
