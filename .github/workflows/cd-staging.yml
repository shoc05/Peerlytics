name: CD staging

# Step 1.9: every push to develop that passes CI is built and deployed to the staging server.
# workflow_dispatch redeploys an existing tag (rollback) or, without one, builds the chosen ref.
# How it works and what to set up: docs/deploy.md.
# Note: GitHub runs workflow_run workflows from the default branch, so this only fires once
# the file is on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to deploy again (e.g. sha-1a2b3c4). Empty builds the selected branch.
        required: false
        type: string

permissions: {}

jobs:
  prepare:
    name: Decide what to deploy
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.what.outputs.sha }}
      tag: ${{ steps.what.outputs.tag }}
      build: ${{ steps.what.outputs.build }}
    steps:
      - id: what
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT" == workflow_dispatch && -n "$DISPATCH_TAG" ]]; then
            if [[ ! "$DISPATCH_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::Not a valid image tag: $DISPATCH_TAG"
              exit 1
            fi
            { echo "sha="; echo "tag=$DISPATCH_TAG"; echo "build=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha="$RUN_SHA"
          [[ "$EVENT" == workflow_dispatch ]] && sha="$REF_SHA"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Unexpected commit: $sha"; exit 1; }
          { echo "sha=$sha"; echo "tag=sha-${sha:0:7}"; echo "build=true"; } >> "$GITHUB_OUTPUT"

  build:
    name: Build images
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-images.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      tag: ${{ needs.prepare.outputs.tag }}

  deploy:
    name: Deploy to staging
    needs: [prepare, build]
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    # DEPLOY_MODE=local: the job runs on the self-hosted runner that is itself the server
    # (docs/deploy.md, "Your PC as the server"). Otherwise a GitHub runner reaches it over SSH.
    runs-on: ${{ vars.DEPLOY_MODE == 'local' && fromJSON('["self-hosted", "peerlytics-server"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: read
    environment:
      name: staging
      url: ${{ vars.DEPLOY_MODE == 'local' && 'http' || 'https' }}://${{ vars.STAGING_DOMAIN }}/api/health
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      DOMAIN: ${{ vars.STAGING_DOMAIN }}
      MODE: ${{ vars.DEPLOY_MODE || 'ssh' }}
      # The PC as the server has no certificates: plain HTTP on *.localhost.
      SCHEME: ${{ vars.DEPLOY_MODE == 'local' && 'http' || 'https' }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The deploy scripts come from the commit being deployed (or the selected ref on a redeploy).
          ref: ${{ needs.prepare.outputs.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: infra

      - name: Check the settings
        run: |
          missing=()
          case "$MODE" in
            ssh)
              [[ -n "$SSH_HOST" ]] || missing+=(secret SSH_HOST)
              [[ -n "$SSH_USER" ]] || missing+=(secret SSH_USER)
              ;;
            local) ;;
            *) missing+=(variable DEPLOY_MODE: ssh or local) ;;
          esac
          [[ "$DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]] || missing+=(variable STAGING_DOMAIN)
          if (( ${#missing[@]} )); then
            echo "::error::Missing or invalid in the staging environment: ${missing[*]}"
            exit 1
          fi

      - name: Set up SSH (strict host key checking)
        if: vars.DEPLOY_MODE != 'local'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          (umask 077; printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key)
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host peerlytics
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config ~/.ssh/known_hosts

      # on-server runs one shell command on the server: over SSH, or right here when this runner
      # is the server (DEPLOY_MODE=local). stdin is passed through either way.
      - name: Choose how to reach the server
        run: |
          # shellcheck disable=SC2016 # $1 is the helper's argument, not this step's
          if [[ "$MODE" == local ]]; then run='exec bash -c "$1"'; else run='exec ssh peerlytics "$1"'; fi
          printf '#!/usr/bin/env bash\n%s\n' "$run" > "$RUNNER_TEMP/on-server"
          chmod 700 "$RUNNER_TEMP/on-server"

      - name: Copy the deploy files to the server
        run: |
          tar -C infra -czf - compose edge scripts \
            | "$RUNNER_TEMP/on-server" 'mkdir -p /opt/peerlytics/infra && tar -C /opt/peerlytics/infra -xzf -'

      - name: Log the server in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        # The token goes over stdin only; ACTOR is a GitHub login, expanded here on purpose.
        run: |
          printf '%s' "$GH_TOKEN" | "$RUNNER_TEMP/on-server" "docker login ghcr.io -u '$ACTOR' --password-stdin"

      - name: Run deploy.sh staging
        env:
          OWNER: ${{ github.repository_owner }}
        # TAG was checked against the Docker tag pattern in "Decide what to deploy".
        run: |
          "$RUNNER_TEMP/on-server" "IMAGE_PREFIX=ghcr.io/${OWNER,,}/peerlytics bash /opt/peerlytics/infra/scripts/deploy.sh staging '$TAG'"

      - name: Log the server out of GHCR
        if: always()
        run: '"$RUNNER_TEMP/on-server" "docker logout ghcr.io" || true'

      - name: Smoke test /api/health
        run: |
          for i in $(seq 1 20); do
            if body="$(curl -fsS --max-time 10 "$SCHEME://$DOMAIN/api/health")" && grep -q '"ok":true' <<<"$body"; then
              echo "$body"
              exit 0
            fi
            echo "Attempt $i: not healthy yet"
            sleep 6
          done
          echo "::error::$SCHEME://$DOMAIN/api/health did not answer ok"
          exit 1

      # No OWASP ZAP job exists in this repository yet; add the baseline scan here when one does.

      - name: Job summary
        if: always()
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
          MERGED_AT: ${{ github.event.workflow_run.head_commit.timestamp }}
          JOB_STATUS: ${{ job.status }}
        run: |
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          since="n/a (manual run)"
          if [[ -n "$MERGED_AT" ]]; then
            since="$(( ($(date -u +%s) - $(date -u -d "$MERGED_AT" +%s)) / 60 )) min"
          fi
          {
            echo "### Staging deploy: $JOB_STATUS"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`$TAG\` |"
            echo "| Commit | ${SHA:-n/a (redeploy of an existing tag)} |"
            echo "| URL | $SCHEME://$DOMAIN/api/health |"
            echo "| Finished | $now |"
            echo "| Since the merge | $since |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the SSH key and helper
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/on-server"
          # Only the GitHub runner got a key; on the PC this would be the user's own file.
          if [[ "$MODE" != local ]]; then rm -f ~/.ssh/deploy_key; fi
