name: Security

# Scans the full git history for secrets on every pull request and push to the main branches.
# .gitleaks.toml lists the one reviewed finding. A new finding fails this check: replace the
# secret first, then remove it from the code.
on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secrets scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            git . --config .gitleaks.toml --redact --no-banner
