---
# Docker from Docker's own apt repository (Ubuntu's docker.io lags behind).
# The apps run as docker compose projects (infra/compose); only Caddy (infra/edge) publishes
# ports, 80 and 443.
- name: Create the apt keyrings folder
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Add Docker's signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Add Docker's apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable
    filename: docker
    state: present

- name: Install Docker Engine and the compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Start Docker now and at boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Let the deploy user run docker
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: [docker]
    append: true

# Container logs rotate, so a chatty container can't fill the boot volume.
- name: Rotate container logs
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }
    owner: root
    group: root
    mode: "0644"
  notify: Restart Docker
