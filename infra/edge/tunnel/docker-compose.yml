# Public HTTPS address for the production API when the server is a PC behind a home network
# (DEPLOY_MODE=local). Tailscale Funnel takes https://<name>.ts.net traffic to Caddy, with no
# open ports on the router. Not used on a cloud VM, where Caddy is public itself.
# Started by infra/scripts/setup-tunnel.sh. Secret: /opt/peerlytics/tunnel.env (TS_AUTHKEY).
name: tunnel

services:
  tailscale:
    image: tailscale/tailscale:v1.80.3
    hostname: peerlytics
    env_file:
      - path: ${TUNNEL_ENV_FILE:-/opt/peerlytics/tunnel.env}
        required: true
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ./serve.json:/config/serve.json:ro
      - tailscale_state:/var/lib/tailscale
    networks: [edge]
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  tailscale_state: {}

networks:
  edge:
    external: true
    name: edge
