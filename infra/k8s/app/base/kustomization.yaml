# Peerlytics app (step 4.1). Shared by every environment; the overlays in ../overlays set the
# namespace, hosts, image tags and sizes. Build: kubectl kustomize infra/k8s/app/overlays/staging
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: peerlytics
    includeSelectors: false
resources:
  - config.yaml
  - postgres.yaml
  - backup.yaml
  - backend.yaml
  - collab.yaml
  - notifier.yaml
  - ingress.yaml
images:
  # Tags are set at deploy time: kustomize edit set image ghcr.io/shoc05/peerlytics-backend=…:<tag>
  - name: ghcr.io/shoc05/peerlytics-backend
    newTag: latest
  - name: ghcr.io/shoc05/peerlytics-collab
    newTag: latest
  - name: ghcr.io/shoc05/peerlytics-notifier
    newTag: latest
