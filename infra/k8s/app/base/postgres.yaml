# PostgreSQL 16, one pod with its own disk (k3s's local-path storage). Only the backend and the
# backup job may connect (NetworkPolicy below).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: peerlytics-postgres
  labels:
    app.kubernetes.io/name: peerlytics-postgres
spec:
  serviceName: peerlytics-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: peerlytics-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: peerlytics-postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70 # "postgres" in postgres:16-alpine
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_USER, value: peerlytics }
            - { name: POSTGRES_DB, value: peerlytics }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: peerlytics-postgres, key: POSTGRES_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: [pg_isready, -U, peerlytics, -d, peerlytics] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: [pg_isready, -U, peerlytics, -d, peerlytics] }
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 10Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: peerlytics-postgres
  labels:
    app.kubernetes.io/name: peerlytics-postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: peerlytics-postgres
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: peerlytics-postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: peerlytics-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: peerlytics-backend
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: peerlytics-postgres-backup
      ports:
        - { protocol: TCP, port: 5432 }
