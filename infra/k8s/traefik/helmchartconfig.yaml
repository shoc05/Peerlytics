# k3s's bundled Traefik: HTTPS certificates from Let's Encrypt (TLS-ALPN challenge on port 443)
# and every http:// request redirected to https://. Cluster-wide, applied once:
#   kubectl apply -f infra/k8s/traefik/helmchartconfig.yaml
# Replace the email first: Let's Encrypt sends expiry warnings there.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    additionalArguments:
      - "--certificatesresolvers.letsencrypt.acme.email=CHANGE-ME@example.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/data/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
    persistence:
      enabled: true
      path: /data
