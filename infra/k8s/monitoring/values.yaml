# kube-prometheus-stack values for k3s (step 5.3). Install: see README.md.
# Non-secret settings only. Put the alert e-mail addresses in values-local.yaml (git-ignored)
# and the SMTP password in the alertmanager-smtp Secret.

# k3s runs the control plane inside one binary; these scrapes only produce false alerts there.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 7d
    # Pick up the ServiceMonitors and PrometheusRules in this folder, whatever their labels.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 100m, memory: 400Mi }
      limits: { memory: 1Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path   # k3s default
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 5Gi

grafana:
  admin:
    existingSecret: grafana-admin      # keys: admin-user, admin-password
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: local-path
    size: 1Gi
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard          # dashboards/*.json arrive through kustomization.yaml
      searchNamespace: monitoring

alertmanager:
  alertmanagerSpec:
    # Mounted at /etc/alertmanager/secrets/alertmanager-smtp/
    secrets: [alertmanager-smtp]
  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: smtp.gmail.com:587
      smtp_require_tls: true
      smtp_from: CHANGE_ME_in_values-local        # e.g. peerlytics.alerts@gmail.com
      smtp_auth_username: CHANGE_ME_in_values-local
      smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/password
    route:
      receiver: email
      group_by: [alertname, namespace, service]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # The always-firing heartbeat from kube-prometheus-stack: not worth an e-mail.
        - receiver: "null"
          matchers: [alertname = "Watchdog"]
        - receiver: "null"
          matchers: [alertname = "InfoInhibitor"]
    receivers:
      - name: "null"
      - name: email
        email_configs:
          - to: CHANGE_ME_in_values-local         # the team's alert address
            send_resolved: true
