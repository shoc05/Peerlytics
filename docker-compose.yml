# Local stack: PostgreSQL 16, a one-off migration run, then the API.
#   docker compose up --build        # API on http://localhost:5000, database on localhost:5433
#   docker compose down              # keeps the data volume; add -v to wipe it
# Settings come from the repo-root .env (see .env.example). POSTGRES_PASSWORD is required.
# Both ports are bound to 127.0.0.1 only, so nothing is reachable from the network.
name: peerlytics

x-database-url: &database-url
  DATABASE_URL: postgres://${POSTGRES_USER:-peerlytics}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-peerlytics}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-peerlytics}
      POSTGRES_USER: ${POSTGRES_USER:-peerlytics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 5433 on the host so a locally installed PostgreSQL on 5432 doesn't clash.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: &backend-build
      context: .
      dockerfile: backend/Dockerfile
    command: ["npm", "run", "migrate:up"]
    environment:
      <<: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    # Same build as migrate; the second build comes straight from the layer cache.
    build: *backend-build
    env_file:
      - path: .env
        required: false
    environment:
      <<: *database-url
      PORT: "5000"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5000}:5000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
