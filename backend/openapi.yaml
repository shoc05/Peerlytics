    post:
      tags: [Extensions]
      operationId: grantExtension
      summary: Give one group a new deadline
      description: |
        Only while the workspace is still open. Logs who, when and why. Today the route writes
        `extendedDeadline` on the Firestore group and an `auditLog` document. Once PostgreSQL is in, it also inserts
        into `group_extensions` and `audit_log` (`deadline.extended`).
      x-roles: [lecturer]
      x-access: A lecturer of this workspace
      x-owner: Kezang
      x-step: '4.6'
      x-status: existing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [deadline, reason]
              properties:
                deadline: { type: string, format: date-time, description: Must be at least 1 minute in the future }
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [groupId, deadline, previous, reason]
                properties:
                  groupId: { type: string }
                  deadline: { type: string, format: date-time }
                  previous: { type: [string, 'null'], format: date-time }
