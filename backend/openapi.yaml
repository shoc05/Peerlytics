openapi: 3.1.0
info:
  title: Peerlytics API
  version: 0.1.0
  summary: Collaborative writing with fair, explained group grading.
  description: |
    Step 1.1 (PEER-21) · Owner: Sonam · Status: agreed contract.

    This is the contract for every backend route the team builds. Build each route against it and
    check its body with Zod `.strict()` (the same rule as `additionalProperties: false` here).
    If a shape has to change, change this file in its own PR first. Tables are in `docs/db-schema.md`,
    and roles, tokens and auth errors are in `docs/auth-contract.md`.

    **Conventions**

    - Every path is under `/api`. Every route needs `Authorization: Bearer <Firebase ID token>`, except `GET /api/health`
      and `GET /api/reports/report.xsl` (a fixed stylesheet with no data in it, which browsers fetch without a token).
    - `x-roles` lists the custom-claim roles allowed (`requireRole(...)`). `x-access` is the extra row-level rule
      the route checks against PostgreSQL, for example "lecturer of this course" (an `enrolments` row with
      `course_role = 'lecturer'`). Failing either check gives `403 FORBIDDEN`. An id the caller isn't allowed to
      know about gives `404 NOT_FOUND`, so ids can't be probed.
    - `x-owner` and `x-step` show who builds the route and in which step. `x-status: existing` means the route is
      already on `develop` and this file only documents it.
    - A path id that is malformed (not a uuid, or not a valid workspace id) is `404 NOT_FOUND`, the same as an unknown id.
    - Archived courses are read-only: every change except unarchiving is `403 COURSE_ARCHIVED`.
    - `503` with `AUTH_UNAVAILABLE`, `DB_UNAVAILABLE` or `FIRESTORE_UNAVAILABLE` means the server is missing the Firebase
      Admin SDK, PostgreSQL or Firestore configuration. It is not listed on each route.
    - Errors are `{ "error": "<for people>", "code": "<for programs>", "details"?: [{ path, message }] }`.
      `details` lists Zod issues and never echoes the submitted values.
    - Lecturers see a workspace's content, analysis and grades only after it is submitted
      (`409 NOT_SUBMITTED` before then). AI likelihood is a signal, not proof, and every UI that shows it says so.
    - Times are ISO 8601 with an offset. Scores and grades are 0–10 with two decimals.
  contact:
    name: Peerlytics team (CTE412, CST)
servers:
  - url: http://localhost:5000/api
    description: Local development (npm run dev:server)
security:
  - bearerAuth: []

tags:
  - name: Health
    description: Liveness and readiness, no token needed.
  - name: Auth
    description: Roles and claims (Kezang, step 1.2). Documented here so the contract is complete.
  - name: Courses
    description: Courses and the course site (Overview, Assignments, Groups, Members, Grades).
  - name: Enrolment
    description: Join codes and course members.
  - name: Announcements
    description: The course Overview tab.
  - name: Assignments
    description: Brief, deadline and rubric weights.
  - name: Groups
    description: Group workspaces (workspace = project = group). The id is the Firestore `groups/{id}`.
  - name: Extensions
    description: Per-group deadline extensions (Kezang, step 4.6).
  - name: Tasks
    description: Group task list; feeds the Tasks score.
  - name: Submissions
    description: Tracking events and submitting a workspace.
  - name: Analysis
    description: Write-once AI and writing analysis per submission.
  - name: Grades
    description: Suggested grades, lecturer overrides and CSV export.
  - name: Reports
    description: XML report with an XSLT stylesheet.
  - name: Peer evaluation
    description: Teammate ratings behind peer_eval_enabled; not part of the grade.
  - name: Comparison
    description: Every group in a course side by side, behind course_dashboard_enabled.
  - name: Usage
    description: AI calls, tokens and cost per college (Tshewang, step 3.10).
  - name: Data deletion
    description: Deleting personal data on request (Tshewang, step 4.9).
  - name: Inline comments
    description: Lecturer comments anchored to submitted text (Kezang, step 4.6).
  - name: Legacy
    description: Old analysis routes, removed in step 2.4.

paths:
  # ───────────────────────────── Health and auth ─────────────────────────────
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness and readiness for Docker and Kubernetes probes
      security: []
      x-roles: [public]
      x-owner: Sonam
      x-step: '0.6'
      x-status: existing
      responses:
        '200':
          description: The server is up. `db` is `down` when PostgreSQL can't be reached; the process still answers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: The signed-in user as the backend sees them
      description: Needs `requireAuth` only, so it works before a role is picked.
      x-roles: [any signed-in user]
      x-owner: Kezang
      x-step: '1.2'
      x-status: existing
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/role:
    post:
      tags: [Auth]
      operationId: chooseRole
      summary: Pick student or lecturer, once, at sign-up
      x-roles: [any signed-in user without a role]
      x-owner: Kezang
      x-step: '1.2'
      x-status: existing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { type: string, enum: [student, lecturer] }
      responses:
        '200':
          description: The claim and its Firestore mirror are set. The client then calls `getIdToken(true)`.
          content:
            application/json:
              schema:
                type: object
                required: [role, collegeId]
                properties:
                  role: { $ref: '#/components/schemas/Role' }
                  collegeId: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: '`ROLE_ALREADY_SET`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/users/{uid}/role:
    post:
      tags: [Auth]
      operationId: setUserRole
      summary: Set anyone's role (superAdmin)
      description: Revokes the target's refresh tokens and writes `role.changed` to `audit_log`.
      x-roles: [superAdmin]
      x-owner: Kezang
      x-step: '1.2'
      x-status: existing
      parameters:
        - $ref: '#/components/parameters/Uid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/Role' }
                collegeId: { type: [string, 'null'], default: null }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [uid, role, collegeId]
                properties:
                  uid: { type: string }
                  role: { $ref: '#/components/schemas/Role' }
                  collegeId: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: '`FORBIDDEN`, or `CANNOT_CHANGE_OWN_ROLE` when `uid` is the caller'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: '`USER_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ───────────────────────────── Courses and enrolment ─────────────────────────────
  /courses:
    get:
      tags: [Courses]
      operationId: listMyCourses
      summary: My courses
      description: |
        Students and lecturers get the courses they are enrolled in. A collegeAdmin gets every course in their
        college, and a superAdmin every course. Archived courses are left out unless `includeArchived=true`.
      x-roles: [student, lecturer, collegeAdmin, superAdmin]
      x-owner: Sonam
      x-step: '2.1'
      parameters:
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [courses]
                properties:
                  courses:
                    type: array
                    items: { $ref: '#/components/schemas/CourseSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Courses]
      operationId: createCourse
      summary: Create a course
      description: |
        Creates the course with a random 8-character join code and enrols the caller as its lecturer
        (`joined_via = 'owner'`). `collegeId` comes from the caller's claim.
      x-roles: [lecturer]
      x-owner: Sonam
      x-step: '2.1'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseCreate' }
      responses:
        '201':
          description: Created
          headers:
            Location: { schema: { type: string }, description: '/api/courses/{courseId}' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Course' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /courses/join:
    post:
      tags: [Enrolment]
      operationId: joinCourse
      summary: Join a course with its join code
      description: The code is case-insensitive and spaces are removed. Limited to 10 attempts a minute per user, so codes can't be guessed.
      x-roles: [student]
      x-owner: Sonam
      x-step: '2.1'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [joinCode]
              properties:
                joinCode: { type: string, minLength: 8, maxLength: 12, examples: ['K7QM-3XPA', 'k7qm3xpa'] }
      responses:
        '200':
          description: Enrolled as a student
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: '`FORBIDDEN` (not a student), or `JOIN_DISABLED` (the lecturer turned joining off, or the course is archived)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: '`INVALID_JOIN_CODE`: no course has that code'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`ALREADY_ENROLLED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /courses/{courseId}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [Courses]
      operationId: getCourse
      summary: One course (the course site header)
      description: '`joinCode` is only included for the course''s lecturers and admins.'
      x-roles: [student, lecturer, collegeAdmin, superAdmin]
      x-access: Enrolled in the course, or collegeAdmin of its college, or superAdmin
      x-owner: Sonam
      x-step: '2.1'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Course' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Courses]
      operationId: updateCourse
      summary: Edit a course, turn joining on or off, archive it
      description: 'An archived course accepts only `{ "archived": false }` (with or without other fields); anything else is `403 COURSE_ARCHIVED`.'
      x-roles: [lecturer]
      x-access: Lecturer of this course
      x-owner: Sonam
      x-step: '2.1'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Course' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /courses/{courseId}/join-code:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    post:
      tags: [Enrolment]
      operationId: resetJoinCode
      summary: Make a new join code (the old one stops working)
      description: Writes `course.join_code_reset` to `audit_log`. Students who already joined stay enrolled.
      x-roles: [lecturer]
      x-access: Lecturer of this course
      x-owner: Sonam
      x-step: '2.1'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [joinCode]
                properties:
                  joinCode: { $ref: '#/components/schemas/JoinCode' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /courses/{courseId}/members:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [Enrolment]
      operationId: listCourseMembers
      summary: The Members tab
      description: Students see names, course roles and join dates. Lecturers and admins also see emails and how each member joined.
      x-roles: [student, lecturer, collegeAdmin, superAdmin]
      x-access: Enrolled in the course, or collegeAdmin of its college, or superAdmin
      x-owner: Sonam
      x-step: '2.1'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: '#/components/schemas/CourseMember' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /courses/{courseId}/members/{uid}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/Uid'
    delete:
      tags: [Enrolment]
      operationId: removeCourseMember
      summary: Remove a student from the course
      description: Also removes them from groups that haven't submitted yet. Submitted groups keep their history.
      x-roles: [lecturer]
      x-access: Lecturer of this course; the target is a student in it
      x-owner: Sonam
      x-step: '2.1'
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Announcements ─────────────────────────────
  /courses/{courseId}/announcements:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [Announcements]
      operationId: listAnnouncements
      summary: The Overview tab, pinned first, newest first
      x-roles: [student, lecturer, collegeAdmin, superAdmin]
      x-access: Enrolled in the course, or collegeAdmin of its college, or superAdmin
      x-owner: Sonam
      x-step: '2.1'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [announcements]
                properties:
                  announcements:
                    type: array
                    items: { $ref: '#/components/schemas/Announcement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Announcements]
      operationId: createAnnouncement
      summary: Post an announcement
      description: Enrolled students get an in-app notification (notifier, step 2.5).
      x-roles: [lecturer]
      x-access: Lecturer of this course; the course is not archived (`403 COURSE_ARCHIVED`)
      x-owner: Sonam
      x-step: '2.1'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnouncementCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Announcement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /announcements/{announcementId}:
    parameters:
      - $ref: '#/components/parameters/AnnouncementId'
    patch:
      tags: [Announcements]
      operationId: updateAnnouncement
      summary: Edit or pin an announcement
      x-roles: [lecturer]
      x-access: Lecturer of the announcement's course
      x-owner: Sonam
      x-step: '2.1'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnouncementUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Announcement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Announcements]
      operationId: deleteAnnouncement
      summary: Delete an announcement
      x-roles: [lecturer]
      x-access: Lecturer of the announcement's course
      x-owner: Sonam
      x-step: '2.1'
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Assignments ─────────────────────────────
  /courses/{courseId}/assignments:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [Assignments]
      operationId: listAssignments
      summary: The Assignments tab, by deadline
      description: For a student, each item also has `myWorkspaceId` (or null) and `effectiveDeadline` for their group.
      x-roles: [student, lecturer, collegeAdmin, superAdmin]
      x-access: Enrolled in the course, or collegeAdmin of its college, or superAdmin
      x-owner: Sonam
      x-step: '2.1'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [assignments]
                properties:
                  assignments:
                    type: array
                    items: { $ref: '#/components/schemas/Assignment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Assignments]
      operationId: createAssignment
      summary: Create an assignment with a brief, deadline and rubric weights
      description: Weights left out default to 0.25 each. If any are given, all four must be given and add up to 1.00.
      x-roles: [lecturer]
      x-access: Lecturer of this course; the course is not archived (`403 COURSE_ARCHIVED`)
      x-owner: Sonam
      x-step: '2.1'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignment' }
        '400':
          description: '`INVALID_BODY` (including weights that don''t add up to 1.00) or `DEADLINE_IN_PAST`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /assignments/{assignmentId}:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    get:
      tags: [Assignments]
      operationId: getAssignment
      summary: One assignment
      x-roles: [student, lecturer, collegeAdmin, superAdmin]
      x-access: Enrolled in its course, or collegeAdmin of its college, or superAdmin
      x-owner: Sonam
      x-step: '2.1'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Assignments]
      operationId: updateAssignment
      summary: Edit an assignment
      description: |
        Changing `deadline` moves it for every group without an extension. Changing `weights` affects grades
        computed from now on; grades already computed keep the weights they were computed with.
      x-roles: [lecturer]
      x-access: Lecturer of its course
      x-owner: Sonam
      x-step: '2.1'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignment' }
        '400':
          description: '`INVALID_BODY` or `DEADLINE_IN_PAST`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Assignments]
      operationId: deleteAssignment
      summary: Delete an assignment that has no submissions
      x-roles: [lecturer]
      x-access: Lecturer of its course
      x-owner: Sonam
      x-step: '2.1'
      responses:
        '204': { description: 'Deleted, with its empty workspaces' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`HAS_SUBMISSIONS`: at least one group has submitted'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ───────────────────────────── Groups (workspaces) ─────────────────────────────
  /assignments/{assignmentId}/groups:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    get:
      tags: [Groups]
      operationId: listGroups
      summary: The Groups tab for one assignment
      description: Students see every group's name and members, but only open their own workspace.
      x-roles: [student, lecturer, collegeAdmin, superAdmin]
      x-access: Enrolled in its course, or collegeAdmin of its college, or superAdmin
      x-owner: Sonam
      x-step: '2.1'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [groups, ungroupedStudents]
                properties:
                  groups:
                    type: array
                    items: { $ref: '#/components/schemas/Workspace' }
                  ungroupedStudents:
                    type: array
                    description: Enrolled students with no group for this assignment. Empty for students.
                    items: { $ref: '#/components/schemas/UserRef' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Groups]
      operationId: createGroup
      summary: Create a group workspace by hand
      description: Creates the PostgreSQL row and the Firestore `groups/{id}` document together. Members get an in-app notification.
      x-roles: [lecturer]
      x-access: Lecturer of its course
      x-owner: Sonam
      x-step: '2.1'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '400':
          description: '`INVALID_BODY`, or `NOT_ENROLLED` when a member isn''t a student in the course'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`ALREADY_IN_GROUP` (a member already has a group for this assignment) or `CONFLICT` (the name is taken)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /assignments/{assignmentId}/groups/auto:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    post:
      tags: [Groups]
      operationId: autoCreateGroups
      summary: Shuffle ungrouped students into random groups
      description: |
        Takes every student enrolled in the course who has no group for this assignment, shuffles them
        (`crypto.randomInt`, Fisher–Yates) and splits them into `floor(n / size)` groups; the students left over
        join the last groups one each ("the last can be one bigger"). If that would make a group bigger than
        `size + 1`, one more group is made instead and students are spread as evenly as possible
        (11 students, size 5 -> 5, 6; 14 students, size 5 -> 5, 5, 4). Groups are named "Group N", continuing
        after existing ones. Each member gets an in-app notification (`users/{uid}/notifications`, type
        `group-assigned`), and `groups.auto_created` is written to `audit_log`. The groups are created in one
        transaction: all or none.
      x-roles: [lecturer]
      x-access: Lecturer of its course
      x-owner: Sonam
      x-step: '3.7'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [size]
              properties:
                size: { type: integer, minimum: 2, maximum: 20 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items: { $ref: '#/components/schemas/Workspace' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`NOT_ENOUGH_STUDENTS`: fewer ungrouped students than `size`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /me/workspaces:
    get:
      tags: [Groups]
