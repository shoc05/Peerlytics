          content:
            text/csv:
              schema: { type: string }
              example: |
                course_code,assignment,group,student_name,student_email,time,edits,writing,tasks,deductions,suggested,final,overridden_by,override_reason
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/{workspaceId}/grades:
