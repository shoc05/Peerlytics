  # ───────────────────────────── Tracking and submissions ─────────────────────────────
  /workspaces/{workspaceId}/events:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Submissions]
      operationId: postTrackingEvents
      summary: Send a batch of tracking events (time, edit counts, paste events)
      description: |
        The batch the browser's tracking queue (`src/collab/trackingQueue.js`) sends, including events queued
        while offline. Each event is checked with Ajv against `schemas/tracking-event.json` (SO4). Bad events are
        dropped and counted, never fatal. Events contain counts, lengths and classes only, never typed or pasted text.
      x-roles: [student]
      x-access: A member; the workspace is `open`
      x-owner: Sonam
      x-step: '2.4'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: '#/components/schemas/TrackingEvent' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [accepted, rejected]
                properties:
                  accepted: { type: integer, minimum: 0 }
                  rejected: { type: integer, minimum: 0 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/WorkspaceSubmitted' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /workspaces/{workspaceId}/submission:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Submissions]
      operationId: getSubmission
      summary: The workspace's submission
      x-roles: [student, lecturer, collegeAdmin, superAdmin]
      x-access: A member, or a lecturer of its course, or an admin of its college
      x-owner: Sonam
      x-step: '2.4'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Submission' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NotSubmitted' }
    post:
      tags: [Submissions]
      operationId: submitWorkspace
      summary: Submit the group's work
      description: |
        The backend reads the document and the tracking metrics itself (Firestore, Admin SDK); the browser only
        sends which file is being submitted. It locks the inputs, sets the workspace to `submitted`, then runs
        analysis (OpenAI, or the legacy fallback) with a time limit and computes grades.

        **A submission never fails because analysis failed.** If every provider fails, the submission is still
        `201`, with an `unavailable` analysis result. The deadline job (step 1.6) uses the same service with
        `trigger = 'deadline'`.
      x-roles: [student]
      x-access: A member; the workspace is `open`
      x-owner: Sonam
      x-step: '2.4'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fileId]
              properties:
                fileId: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$', description: 'Firestore `groups/{id}/files/{fileId}`' }
                tabs:
                  description: Document tab titles (step 2.3). Dropped if invalid, never fatal.
                  type: array
                  maxItems: 50
                  items: { $ref: '#/components/schemas/DocumentTab' }
      responses:
        '201':
          description: Submitted
          content:
            application/json:
              schema:
                type: object
                required: [submission, analysis]
                properties:
                  submission: { $ref: '#/components/schemas/Submission' }
                  analysis:
                    description: null only if the analysis could not even be saved; the submission is kept either way.
                    oneOf: [{ $ref: '#/components/schemas/AnalysisResult' }, { type: 'null' }]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`ALREADY_SUBMITTED` or `ALREADY_LOCKED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ───────────────────────────── Analysis ─────────────────────────────
  /submissions/{submissionId}/analysis:
    parameters:
      - $ref: '#/components/parameters/SubmissionId'
    get:
      tags: [Analysis]
      operationId: getAnalysis
      summary: The analysis for a submission (latest first)
      description: '`analysis_results` is append-only, so `history` shows every run. `current` is the newest. `404` if no analysis was saved.'
      x-roles: [student, lecturer, collegeAdmin, superAdmin]
      x-access: A member of the workspace, or a lecturer of its course, or an admin of its college
      x-owner: Sonam
      x-step: '2.4'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [current, history]
                properties:
                  current: { $ref: '#/components/schemas/AnalysisResult' }
                  history:
                    type: array
                    items: { $ref: '#/components/schemas/AnalysisResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Analysis]
      operationId: rerunAnalysis
      summary: Run the analysis again (for example after the provider was unavailable)
      description: |
        Inserts a new `analysis_results` row (the suggested grades are recomputed from step 2.8). Overrides are kept.
        At most 3 runs per submission in any hour, counting the run made at submission time; then `429` with `Retry-After`.
        `provider: legacy` is recorded with `fallbackReason: flag_legacy`.
      x-roles: [lecturer]
      x-access: Lecturer of its course
      x-owner: Sonam
      x-step: '2.4'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                provider:
                  type: string
                  enum: [auto, openai, legacy]
                  default: auto
                  description: '`auto` follows the `ai_provider` flag and the college''s budget'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

