      x-owner: Sonam
      x-step: '2.8'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [grade, reason]
              properties:
                grade: { $ref: '#/components/schemas/Score' }
                reason: { type: string, minLength: 5, maxLength: 1000 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Override' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Reports ─────────────────────────────
  /workspaces/{workspaceId}/report.xml:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Reports]
      operationId: getWorkspaceReportXml
      summary: The workspace report as XML
      description: |
        Workspace, students, metrics, deductions, grades, AI flags and paste flags. Valid against
        `backend/reports/report.xsd`, and it links `report.xsl` with an `xml-stylesheet` processing instruction,
        so a browser shows it as a printable HTML report (red = AI-flagged, yellow = pasted).
      x-roles: [lecturer, collegeAdmin, superAdmin]
      x-access: Lecturer of its course, or an admin of its college; after submission
      x-owner: Sonam
      x-step: '2.10'
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NotSubmitted' }

  /reports/report.xsl:
    get:
      tags: [Reports]
      operationId: getReportStylesheet
      summary: The XSLT stylesheet that turns report.xml into a printable HTML page
      description: |
        No token: the browser fetches it when it opens report.xml (the xml-stylesheet processing instruction points
        here), and it contains no data. Red marks sentences flagged as possibly AI-generated; yellow marks students
        with large pastes. Per-student and group totals are XPath expressions, explained in a comment at the top.
      security: []
      x-roles: [public]
      x-owner: Sonam
      x-step: '2.10'
      responses:
        '200':
          description: OK
          content:
            text/xsl:
              schema: { type: string }

  # ───────────────────────────── Peer evaluation ─────────────────────────────
  /workspaces/{workspaceId}/peer-evaluations:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Peer evaluation]
      operationId: getPeerEvaluations
      summary: Peer ratings
      description: |
        Behind `peer_eval_enabled`. A student gets the ratings they gave. A lecturer gets each member's average,
        the number of ratings and the comments, without who wrote them. Not part of the grade.
      x-roles: [student, lecturer]
      x-access: A member, or a lecturer of its course; after submission
      x-flag: peer_eval_enabled
      x-owner: Sonam
      x-step: '3.7'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PeerEvaluationsGiven'
                  - $ref: '#/components/schemas/PeerEvaluationSummary'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/FeatureDisabledOrNotFound' }
        '409': { $ref: '#/components/responses/NotSubmitted' }
    put:
      tags: [Peer evaluation]
      operationId: submitPeerEvaluations
      summary: Rate each teammate 1–5, with an optional comment
      description: Replaces the caller's earlier ratings for this workspace. Every other member must be rated once, and not the caller.
      x-roles: [student]
      x-access: A member; after submission
      x-flag: peer_eval_enabled
      x-owner: Sonam
      x-step: '3.7'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ratings]
              properties:
                ratings:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    additionalProperties: false
                    required: [rateeId, rating]
                    properties:
                      rateeId: { $ref: '#/components/schemas/Uid' }
                      rating: { type: integer, minimum: 1, maximum: 5 }
                      comment: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeerEvaluationsGiven' }
        '400':
          description: '`INVALID_BODY` (including rating yourself, a non-member, or missing a teammate)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/FeatureDisabledOrNotFound' }
        '409': { $ref: '#/components/responses/NotSubmitted' }

  # ───────────────────────────── Comparison ─────────────────────────────
  /courses/{courseId}/comparison:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [Comparison]
      operationId: getCourseComparison
      summary: Compare every submitted group in a course
      description: |
        Behind `course_dashboard_enabled`. For each submitted group:
        - contribution balance: the Gini coefficient of the members' edit counts, normalised by n(n-1) so that
          0 = edits evenly shared and 1 = one member did everything (a group of one is 0);
        - AI likelihood from the latest analysis;
        - paste level from large pastes per member: none 0, low up to 0.5, medium up to 1.5, high above;
        - the average, lowest and highest final grade (the lecturer's override when there is one).
      x-roles: [lecturer, collegeAdmin, superAdmin]
      x-access: Lecturer of the course, or an admin of its college
      x-flag: course_dashboard_enabled
      x-owner: Sonam
      x-step: '4.7'
      parameters:
        - name: assignmentId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseComparison' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/FeatureDisabledOrNotFound' }

  # ───────────────────────────── Usage ─────────────────────────────
  /usage:
    get:
      tags: [Usage]
      operationId: getUsage
      summary: AI usage and cost for a month
      description: A collegeAdmin sees their own college (`collegeId` is ignored). A superAdmin can pass any `collegeId`, or leave it out for all colleges.
      x-roles: [collegeAdmin, superAdmin]
      x-owner: Tshewang
      x-step: '3.10'
      parameters:
        - name: collegeId
          in: query
          schema: { type: string, format: uuid }
        - name: month
          in: query
          description: Calendar month in UTC. Defaults to the current month.
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', examples: ['2026-10'] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ───────────────────────────── Data deletion ─────────────────────────────
  /me/data:
    delete:
      tags: [Data deletion]
      operationId: deleteMyData
      summary: Delete my account and personal data
      description: |
        Follows "Data deletion" in `docs/db-schema.md`. Personal data is removed or anonymised, and history
        (append-only tables) keeps only an id that no longer links to a person. The Firebase account is deleted
        last. `confirm` must be the literal `DELETE`.
      x-roles: [student, lecturer]
      x-owner: Tshewang
      x-step: '4.9'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeletionConfirm' }
      responses:
        '202':
          description: Accepted; deletion runs in the background and finishes within 24 hours
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/users/{uid}/data:
    parameters:
      - $ref: '#/components/parameters/Uid'
    delete:
      tags: [Data deletion]
      operationId: deleteUserData
      summary: Delete another user's personal data on request
      description: Same as `DELETE /me/data`. A collegeAdmin can do this only for users in their college. Writes `user.data_deleted` to `audit_log`.
      x-roles: [collegeAdmin, superAdmin]
      x-owner: Tshewang
      x-step: '4.9'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeletionConfirm' }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: '`FORBIDDEN`: wrong role, a user outside the caller''s college, or the caller themselves (use `/me/data`)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: '`USER_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ───────────────────────────── Inline comments ─────────────────────────────
  /workspaces/{workspaceId}/comments:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Inline comments]
      operationId: listInlineComments
      summary: Lecturer comments anchored to the submitted text
      description: |
        Today the browser reads and writes these straight to Firestore `groups/{id}/feedback`, under
        `firestore.rules` (step 4.6, Kezang). These routes are the backend equivalent with the same shape and limits,
        for clients that can't use the Firestore SDK (Postman, the XML report). The anchor is `quote`: the exact
        words plus up to 64 characters before and after (`src/feedback/anchors.js`).
      x-roles: [student, lecturer]
      x-access: A member, or a lecturer of its course after submission
      x-owner: Kezang
      x-step: '4.6'
      parameters:
        - name: fileId
          in: query
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [comments]
                properties:
                  comments:
                    type: array
                    items: { $ref: '#/components/schemas/InlineComment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NotSubmitted' }
    post:
      tags: [Inline comments]
      operationId: createInlineComment
      summary: Comment on a passage of a submitted file
      x-roles: [lecturer]
      x-access: Lecturer of its course; the file was submitted
      x-owner: Kezang
      x-step: '4.6'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fileId, quote, comment]
              properties:
                fileId: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
                quote: { $ref: '#/components/schemas/Quote' }
                comment: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InlineComment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NotSubmitted' }

  /workspaces/{workspaceId}/comments/{commentId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: commentId
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
    patch:
      tags: [Inline comments]
      operationId: updateInlineComment
      summary: Edit your comment (only its text)
      x-roles: [lecturer]
      x-access: The comment's author
      x-owner: Kezang
      x-step: '4.6'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [comment]
              properties:
                comment: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InlineComment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Inline comments]
      operationId: deleteInlineComment
      summary: Delete your comment
      x-roles: [lecturer]
      x-access: The comment's author
      x-owner: Kezang
      x-step: '4.6'
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Legacy ─────────────────────────────
  /check:
    post:
      tags: [Legacy]
      operationId: legacyCheck
      summary: Old analysis endpoint (replaced by POST /workspaces/{workspaceId}/submission)
      description: |
        Kept until the frontend moves to the submission route (step 2.4). It runs Hugging Face + Virtual Writing
        Tutor and returns a report; the browser writes it to Firestore. Rate limited to 20 requests a minute per IP.
        Gap: it is not authenticated yet and its 429 body has no `code`; step 1.4 (Tshewang) adds both.
      deprecated: true
      x-roles: [student]
      x-owner: Sonam
      x-status: existing
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: A report built by `services/reportGenerator.js` }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /analyze:
    post:
      tags: [Legacy]
      operationId: legacyAnalyze
      summary: Old text-only analysis endpoint
      description: Same status and gaps as `/check`. Removed with it in step 2.4.
      deprecated: true
      x-roles: [student]
      x-owner: Sonam
      x-status: existing
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Analysis result }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token (JWT)
      description: '`await auth.currentUser.getIdToken()` in the browser. Verified with `verifyIdToken(token, true)`.'

  parameters:
    CourseId:
      name: courseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AnnouncementId:
      name: announcementId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/WorkspaceIdValue' }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GradeId:
      name: gradeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Uid:
      name: uid
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uid' }

  responses:
    BadRequest:
      description: '`INVALID_BODY`: the body, a path parameter or a query parameter failed its Zod schema'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: The request is not valid.
            code: INVALID_BODY
            details: [{ path: title, message: String must contain at least 2 character(s) }]
    Unauthorized:
      description: '`NO_TOKEN`, `TOKEN_INVALID`, `TOKEN_EXPIRED` or `TOKEN_REVOKED`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Your session has expired. Please sign in again., code: TOKEN_EXPIRED }
    Forbidden:
      description: '`NO_ROLE` (no role picked yet) or `FORBIDDEN` (wrong role, or fails `x-access`)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: You do not have permission to do this., code: FORBIDDEN }
    NotFound:
      description: '`NOT_FOUND`: it doesn''t exist, or the caller may not know that it does'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Not found., code: NOT_FOUND }
    FeatureDisabledOrNotFound:
      description: '`FEATURE_DISABLED` (the route''s flag is off) or `NOT_FOUND`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: This feature is not turned on., code: FEATURE_DISABLED }
    NotSubmitted:
      description: '`NOT_SUBMITTED`: lecturers (and peer evaluation) see this only after the workspace is submitted'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: This workspace has not been submitted yet., code: NOT_SUBMITTED }
    WorkspaceSubmitted:
      description: '`WORKSPACE_SUBMITTED`: the workspace is submitted or locked, so its inputs can''t change'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: This workspace has been submitted and can no longer be changed., code: WORKSPACE_SUBMITTED }
    TooManyRequests:
      description: '`RATE_LIMITED`. Wait `Retry-After` seconds.'
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Too many requests. Please wait a moment and try again., code: RATE_LIMITED }

  schemas:
    # ── Shared ──
    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string, description: A message for people. The frontend shows it as is. }
        code: { $ref: '#/components/schemas/ErrorCode' }
        details:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }
    ErrorCode:
      type: string
      description: For programs to check. The auth codes come from `docs/auth-contract.md` §4.
      enum:
        # auth (Kezang, existing)
        - NO_TOKEN
        - TOKEN_INVALID
        - TOKEN_EXPIRED
        - TOKEN_REVOKED
        - NO_ROLE
        - FORBIDDEN
        - INVALID_BODY
        - ROLE_ALREADY_SET
        - CANNOT_CHANGE_OWN_ROLE
        - USER_NOT_FOUND
        - AUTH_UNAVAILABLE
        # extensions (Kezang, existing)
        - GROUP_NOT_FOUND
        - DEADLINE_IN_PAST
        - ALREADY_LOCKED
        # added by this contract
        - NOT_FOUND
        - CONFLICT
        - INVALID_JOIN_CODE
        - JOIN_DISABLED
        - ALREADY_ENROLLED
        - NOT_ENROLLED
        - ALREADY_IN_GROUP
        - NOT_A_MEMBER
        - NOT_ENOUGH_STUDENTS
        - HAS_SUBMISSIONS
        - WORKSPACE_SUBMITTED
        - ALREADY_SUBMITTED
        - NOT_SUBMITTED
        - FEATURE_DISABLED
        - RATE_LIMITED
        - COURSE_ARCHIVED
        # 503: the server is missing configuration
        - DB_UNAVAILABLE
        - FIRESTORE_UNAVAILABLE
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
        db: { type: string, enum: [up, down] }
        version: { type: string }
    Role:
      type: string
      enum: [superAdmin, collegeAdmin, lecturer, student]
    Uid:
      type: string
      minLength: 1
      maxLength: 128
      description: A Firebase uid
    WorkspaceIdValue:
      type: string
      pattern: '^[A-Za-z0-9_-]{1,128}$'
      description: The Firestore `groups/{id}`, also `workspaces.id`
    Score:
      type: number
      minimum: 0
      maximum: 10
      multipleOf: 0.01
    Timestamps:
      type: object
      required: [createdAt]
      properties:
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
    Me:
      type: object
      required: [uid, email, role, collegeId]
      properties:
        uid: { $ref: '#/components/schemas/Uid' }
        email: { type: [string, 'null'], format: email }
        role: { oneOf: [{ $ref: '#/components/schemas/Role' }, { type: 'null' }] }
        collegeId: { type: [string, 'null'] }
    UserRef:
      type: object
      required: [id, displayName]
      properties:
        id: { $ref: '#/components/schemas/Uid' }
        displayName: { type: string }
        email: { type: string, format: email, description: Lecturers and admins only }

    # ── Courses ──
    JoinCode:
      type: string
      pattern: '^[A-HJKMNP-Z2-9]{8}$'
      description: 8 characters with no look-alikes (no 0, O, 1, I or L)
      examples: [K7QM3XPA]
    CourseFields:
      type: object
      properties:
        code: { type: string, minLength: 2, maxLength: 20, examples: [CTE412] }
        title: { type: string, minLength: 2, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 5000 }
        term: { type: [string, 'null'], maxLength: 40, examples: [Autumn 2026] }
    CourseCreate:
      allOf:
        - $ref: '#/components/schemas/CourseFields'
        - type: object
          required: [code, title]
      unevaluatedProperties: false
    CourseUpdate:
      allOf:
        - $ref: '#/components/schemas/CourseFields'
        - type: object
          minProperties: 1
          properties:
            joinCodeEnabled: { type: boolean }
            archived: { type: boolean }
      unevaluatedProperties: false
    CourseSummary:
      type: object
      required: [id, code, title, term, courseRole, archived]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        title: { type: string }
        term: { type: [string, 'null'] }
        courseRole:
          type: [string, 'null']
          enum: [lecturer, student, null]
          description: The caller's role in this course; null for admins who aren't enrolled
        archived: { type: boolean }
    Course:
      allOf:
        - $ref: '#/components/schemas/CourseSummary'
        - $ref: '#/components/schemas/Timestamps'
        - type: object
          required: [description, collegeId, ownerId, joinCodeEnabled, studentCount]
          properties:
            description: { type: [string, 'null'] }
            collegeId: { type: [string, 'null'], format: uuid }
            ownerId: { $ref: '#/components/schemas/Uid' }
            joinCode: { $ref: '#/components/schemas/JoinCode' }
            joinCodeEnabled: { type: boolean }
            studentCount: { type: integer, minimum: 0 }
    CourseMember:
      allOf:
        - $ref: '#/components/schemas/UserRef'
        - type: object
          required: [courseRole, joinedAt]
          properties:
            courseRole: { type: string, enum: [lecturer, student] }
            joinedVia: { type: string, enum: [owner, code, invite], description: Lecturers and admins only }
            joinedAt: { type: string, format: date-time }

    # ── Announcements ──
    AnnouncementCreate:
      type: object
      additionalProperties: false
      required: [title, body]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 10000, description: 'Plain text: shown as text, never as HTML' }
        pinned: { type: boolean, default: false }
    AnnouncementUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 10000 }
        pinned: { type: boolean }
    Announcement:
      allOf:
        - $ref: '#/components/schemas/Timestamps'
        - type: object
          required: [id, courseId, author, title, body, pinned]
          properties:
            id: { type: string, format: uuid }
            courseId: { type: string, format: uuid }
            author: { $ref: '#/components/schemas/UserRef' }
            title: { type: string }
            body: { type: string }
            pinned: { type: boolean }

    # ── Assignments ──
    RubricWeights:
      type: object
      additionalProperties: false
      required: [time, edits, writing, tasks]
      description: Each 0–1 in steps of 0.01. The four must add up to exactly 1.00 (checked by Zod and by a database CHECK).
      properties:
        time: { type: number, minimum: 0, maximum: 1, multipleOf: 0.01, default: 0.25 }
        edits: { type: number, minimum: 0, maximum: 1, multipleOf: 0.01, default: 0.25 }
        writing: { type: number, minimum: 0, maximum: 1, multipleOf: 0.01, default: 0.25 }
        tasks: { type: number, minimum: 0, maximum: 1, multipleOf: 0.01, default: 0.25 }
    AssignmentFields:
      type: object
      properties:
        title: { type: string, minLength: 2, maxLength: 200 }
        brief: { type: string, minLength: 1, maxLength: 20000 }
        deadline: { type: string, format: date-time, description: Must be in the future }
        weights: { $ref: '#/components/schemas/RubricWeights' }
        timeCapMinutes: { type: [integer, 'null'], minimum: 1, maximum: 10000 }
        groupSize: { type: [integer, 'null'], minimum: 1, maximum: 20 }
    AssignmentCreate:
      allOf:
        - $ref: '#/components/schemas/AssignmentFields'
        - type: object
          required: [title, brief, deadline]
      unevaluatedProperties: false
    AssignmentUpdate:
      allOf:
        - $ref: '#/components/schemas/AssignmentFields'
        - type: object
          minProperties: 1
      unevaluatedProperties: false
    Assignment:
      allOf:
        - $ref: '#/components/schemas/Timestamps'
        - type: object
          required: [id, courseId, title, brief, deadline, weights, timeCapMinutes, groupSize, groupCount, submittedCount]
          properties:
            id: { type: string, format: uuid }
            courseId: { type: string, format: uuid }
            title: { type: string }
            brief: { type: string }
            deadline: { type: string, format: date-time }
            weights: { $ref: '#/components/schemas/RubricWeights' }
            timeCapMinutes: { type: [integer, 'null'] }
            groupSize: { type: [integer, 'null'] }
            groupCount: { type: integer, minimum: 0 }
            submittedCount: { type: integer, minimum: 0 }
            myWorkspaceId:
              oneOf: [{ $ref: '#/components/schemas/WorkspaceIdValue' }, { type: 'null' }]
              description: Students only
            effectiveDeadline:
              type: string
              format: date-time
              description: Students only; includes their group's extension

    # ── Groups ──
    WorkspaceCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        memberIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { $ref: '#/components/schemas/Uid' }
    Workspace:
      allOf:
        - $ref: '#/components/schemas/Timestamps'
        - type: object
          required: [id, assignmentId, courseId, name, status, createdVia, members, deadline, effectiveDeadline]
          properties:
            id: { $ref: '#/components/schemas/WorkspaceIdValue' }
            assignmentId: { type: string, format: uuid }
            courseId: { type: string, format: uuid }
            name: { type: string }
            status: { type: string, enum: [open, submitted, locked] }
            createdVia: { type: string, enum: [manual, auto] }
            members:
              type: array
              items: { $ref: '#/components/schemas/UserRef' }
            deadline: { type: string, format: date-time, description: The assignment's deadline }
            effectiveDeadline: { type: string, format: date-time, description: Includes this group's latest extension }
            submittedAt: { type: [string, 'null'], format: date-time }

    # ── Tasks ──
    TaskCreate:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        ownerId: { oneOf: [{ $ref: '#/components/schemas/Uid' }, { type: 'null' }] }
        tabId: { type: [string, 'null'], minLength: 1, maxLength: 64, description: 'A document tab id (`src/collab/tabs.js`)' }
        dueAt: { type: [string, 'null'], format: date-time }
    TaskUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        ownerId: { oneOf: [{ $ref: '#/components/schemas/Uid' }, { type: 'null' }] }
        tabId: { type: [string, 'null'], minLength: 1, maxLength: 64 }
        dueAt: { type: [string, 'null'], format: date-time }
        done: { type: boolean }
    Task:
      allOf:
        - $ref: '#/components/schemas/Timestamps'
        - type: object
          required: [id, workspaceId, title, owner, tabId, dueAt, doneAt, doneBy]
          properties:
            id: { type: string, format: uuid }
            workspaceId: { $ref: '#/components/schemas/WorkspaceIdValue' }
            title: { type: string }
            owner: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
            tabId: { type: [string, 'null'] }
            dueAt: { type: [string, 'null'], format: date-time }
            doneAt: { type: [string, 'null'], format: date-time }
            doneBy: { oneOf: [{ $ref: '#/components/schemas/Uid' }, { type: 'null' }] }

    # ── Tracking and submissions ──
    TrackingEvent:
      type: object
      additionalProperties: false
      required: [kind, payload, at]
      description: |
        The shape from `src/collab/trackingQueue.js`. `schemas/tracking-event.json` (SO4) is the strict per-kind
        version that Ajv checks. Payloads hold numbers and classes only, never text.
      properties:
        kind: { type: string, enum: [metric, paste, version] }
        at: { type: integer, description: When it happened on the device (ms since epoch) }
        payload:
          type: object
          description: |
            metric: `{ timeSpent: minutes (fractions allowed), edits: n, tabId? }`
            paste: `{ fileId, length: n, changeType: 'paste-small' | 'paste-large', tabId? }`
            version: `{ fileId, wordCount, tabId? }`
            A `tabId` matches `^[A-Za-z0-9_-]{1,64}$`. Any other field (for example `contentSnippet`) makes the event invalid.
    DocumentTab:
      type: object
      additionalProperties: false
      required: [id, title, depth, wordCount]
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        title: { type: string, minLength: 1, maxLength: 100 }
        depth: { type: integer, minimum: 0, maximum: 2 }
        wordCount: { type: integer, minimum: 0, maximum: 1000000 }
    AuthorMetrics:
      type: object
      required: [timeSpentSec, edits, pasteEvents, largePastes]
      properties:
        timeSpentSec: { type: integer, minimum: 0 }
        edits: { type: integer, minimum: 0 }
        pasteEvents: { type: integer, minimum: 0 }
        largePastes: { type: integer, minimum: 0 }
        tabEdits:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
          description: Edits per tab id, used by the Tasks score
    Submission:
      type: object
      required: [id, workspaceId, submittedBy, trigger, wordCount, tabs, authorMetrics, submittedAt]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { $ref: '#/components/schemas/WorkspaceIdValue' }
        submittedBy: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }], description: null when the deadline job submitted }
        trigger: { type: string, enum: [manual, deadline] }
        wordCount: { type: integer, minimum: 0 }
        tabs:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/DocumentTab' }
        authorMetrics:
          type: object
          description: Keyed by uid. Students see only their own key.
          additionalProperties: { $ref: '#/components/schemas/AuthorMetrics' }
        submittedAt: { type: string, format: date-time }

    # ── Analysis ──
    FlaggedSentence:
      type: object
      additionalProperties: false
      required: [sentence, reason]
      properties:
        sentence: { type: string, maxLength: 1000 }
        reason: { type: string, maxLength: 500 }
        authorId: { oneOf: [{ $ref: '#/components/schemas/Uid' }, { type: 'null' }], description: 'Who wrote it (from version history), when known' }
    AnalysisResult:
      type: object
      required: [id, submissionId, provider, status, aiLikelihood, flaggedSentences, writingQuality, writingFeedback, difficulty, gradeExplanation, createdAt, notice]
      description: One row of `analysis_results` (write-once). SO4 validates the provider output with Ajv against `schemas/analysis-result.json` before saving.
      properties:
        id: { type: string, format: uuid }
        submissionId: { type: string, format: uuid }
        provider: { type: string, enum: [openai, legacy] }
        model: { type: [string, 'null'] }
        status: { type: string, enum: [completed, partial, unavailable] }
        fallbackReason:
          type: [string, 'null']
          enum: [openai_error, openai_timeout, openai_invalid_output, openai_not_configured, budget_reached, flag_legacy, null]
        aiLikelihood: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        flaggedSentences:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/FlaggedSentence' }
        writingQuality: { oneOf: [{ $ref: '#/components/schemas/Score' }, { type: 'null' }] }
        writingFeedback:
          type: object
          properties:
            strengths: { type: array, items: { type: string } }
            weaknesses: { type: array, items: { type: string } }
            summary: { type: string }
        difficulty: { type: [integer, 'null'], minimum: 1, maximum: 3 }
        gradeExplanation: { type: [string, 'null'], maxLength: 4000 }
        notice:
          type: string
          const: AI likelihood is a signal, not proof. A lecturer reviews every flag.
        createdAt: { type: string, format: date-time }

    # ── Grades ──
    Deduction:
      type: object
      required: [kind, points, reason]
      properties:
        kind: { type: string, enum: [ai, paste] }
        points: { type: number, minimum: 0, maximum: 10 }
        reason: { type: string }
    Grade:
      type: object
      required: [id, workspaceId, assignmentId, student, scores, weights, deductions, suggested, final, overridden, explanation, computedAt]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { $ref: '#/components/schemas/WorkspaceIdValue' }
        assignmentId: { type: string, format: uuid }
        student: { $ref: '#/components/schemas/UserRef' }
        analysisResultId: { type: [string, 'null'], format: uuid }
        scores:
          type: object
          required: [time, edits, writing, tasks]
          description: |
            Time and Edits are always measured. Writing is null when no analysis was available; Tasks is null
            when the group made no tasks. A null score's weight is shared among the others (see `explanation`).
          properties:
            time: { $ref: '#/components/schemas/Score' }
            edits: { $ref: '#/components/schemas/Score' }
            writing: { oneOf: [{ $ref: '#/components/schemas/Score' }, { type: 'null' }] }
            tasks: { oneOf: [{ $ref: '#/components/schemas/Score' }, { type: 'null' }] }
        weights: { $ref: '#/components/schemas/RubricWeights' }
        deductions:
          type: array
          description: |
            Only for the student responsible. Large pastes by this student: 1 = −1, 2–3 = −2, 4+ = −3.
            AI: only sentences the analysis attributes to this student, 1–2 = −1, 3+ = −2 (a signal, not proof).
          items: { $ref: '#/components/schemas/Deduction' }
        suggested: { $ref: '#/components/schemas/Score' }
        final: { $ref: '#/components/schemas/Score' }
        overridden: { type: boolean }
        explanation: { type: string, description: '"Why this grade" in plain English' }
        computedAt: { type: string, format: date-time }
    Override:
      type: object
      required: [id, gradeId, lecturer, previousGrade, newGrade, reason, createdAt]
      properties:
        id: { type: string, format: uuid }
        gradeId: { type: string, format: uuid }
        lecturer: { $ref: '#/components/schemas/UserRef' }
        previousGrade: { $ref: '#/components/schemas/Score' }
        newGrade: { $ref: '#/components/schemas/Score' }
        reason: { type: string }
        createdAt: { type: string, format: date-time }

    # ── Peer evaluation ──
    PeerEvaluationsGiven:
      type: object
      required: [ratings]
      description: A student's own ratings
      properties:
        ratings:
          type: array
          items:
            type: object
            required: [rateeId, rating]
            properties:
              rateeId: { $ref: '#/components/schemas/Uid' }
              rating: { type: integer, minimum: 1, maximum: 5 }
              comment: { type: [string, 'null'] }
              updatedAt: { type: string, format: date-time }
    PeerEvaluationSummary:
      type: object
      required: [members]
      description: The lecturer's view. Raters are not named.
      properties:
        members:
          type: array
          items:
            type: object
            required: [student, average, count, expected, comments]
            properties:
              student: { $ref: '#/components/schemas/UserRef' }
              average: { type: [number, 'null'], minimum: 1, maximum: 5 }
              count: { type: integer, minimum: 0 }
              expected: { type: integer, minimum: 0, description: Number of teammates who could rate them }
              comments: { type: array, items: { type: string } }

    # ── Comparison and usage ──
    CourseComparison:
      type: object
      required: [courseId, groups]
      properties:
        courseId: { type: string, format: uuid }
        assignmentId: { type: [string, 'null'], format: uuid }
        groups:
          type: array
          items:
            type: object
            required: [workspaceId, name, assignmentId, memberCount, contributionGini, aiLikelihood, pasteLevel, largePastes, averageGrade, minGrade, maxGrade]
            properties:
              workspaceId: { $ref: '#/components/schemas/WorkspaceIdValue' }
              name: { type: string }
              assignmentId: { type: string, format: uuid }
              memberCount: { type: integer, minimum: 0 }
              contributionGini: { type: number, minimum: 0, maximum: 1, description: '0 = edits evenly shared, 1 = one person did everything' }
              aiLikelihood: { type: [integer, 'null'], minimum: 0, maximum: 100 }
              pasteLevel: { type: string, enum: [none, low, medium, high] }
              largePastes: { type: integer, minimum: 0 }
              averageGrade: { oneOf: [{ $ref: '#/components/schemas/Score' }, { type: 'null' }] }
              minGrade: { oneOf: [{ $ref: '#/components/schemas/Score' }, { type: 'null' }] }
              maxGrade: { oneOf: [{ $ref: '#/components/schemas/Score' }, { type: 'null' }] }
    UsageReport:
      type: object
      required: [month, colleges]
      properties:
        month: { type: string, examples: ['2026-10'] }
        colleges:
          type: array
          items:
            type: object
            required: [collegeId, calls, promptTokens, completionTokens, costUsd, budgetUsd, byProvider]
            properties:
              collegeId: { type: [string, 'null'], format: uuid }
              calls: { type: integer, minimum: 0 }
              promptTokens: { type: integer, minimum: 0 }
              completionTokens: { type: integer, minimum: 0 }
              costUsd: { type: number, minimum: 0 }
              budgetUsd: { type: [number, 'null'], minimum: 0, description: null when `licensing_enabled` is off or there is no licence }
              byProvider:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    calls: { type: integer }
                    failures: { type: integer }
                    costUsd: { type: number }

    # ── Data deletion ──
    DeletionConfirm:
      type: object
      additionalProperties: false
      required: [confirm]
      properties:
        confirm: { type: string, const: DELETE }
    DeletionAccepted:
      type: object
      required: [status, requestedAt]
      properties:
        status: { type: string, const: accepted }
        requestedAt: { type: string, format: date-time }

    # ── Inline comments ──
    Quote:
      type: object
      additionalProperties: false
      required: [exact]
      properties:
        exact: { type: string, minLength: 1, maxLength: 1000 }
        prefix: { type: string, maxLength: 64, default: '' }
        suffix: { type: string, maxLength: 64, default: '' }
    InlineComment:
      type: object
      required: [id, fileId, quote, comment, lecturerId, lecturerName, createdAt]
      properties:
        id: { type: string }
        fileId: { type: string }
        quote: { $ref: '#/components/schemas/Quote' }
        comment: { type: string }
        lecturerId: { $ref: '#/components/schemas/Uid' }
        lecturerName: { type: string }
        createdAt: { type: string, format: date-time }
